name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux (x86_64 binary + .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libudev-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev pkg-config
      - name: Run tests & build release
        run: |
          cargo test --workspace
          cargo build --release --bin openmad
      - name: Package Linux artifacts
        run: |
          mkdir -p dist
          cp target/release/openmad dist/openmad-linux-x86_64
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "main" ]]; then VERSION="0.1.0"; fi
          bash packaging/debian/build-deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/openmad-linux-x86_64
            dist/openmad_*.deb

  windows:
    name: Build Windows (x86_64 exe + Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests & build release
        run: |
          cargo test --workspace
          cargo build --release --bin openmad
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build Windows Setup
        shell: pwsh
        run: |
          & "$env:ISCC" packaging\windows\openmad.iss
          mkdir -Force dist
          Copy-Item target\release\openmad.exe dist\openmad-windows-x86_64.exe
          Copy-Item packaging\windows\Output\OpenMAD-Setup-*.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/openmad-windows-x86_64.exe
            dist/OpenMAD-Setup-*.exe

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/* --clobber || \
          gh release create "${{ github.ref_name }}" artifacts/* --title "OpenMAD-Rust ${{ github.ref_name }}" --generate-notes
